name: Release workflow
on:
  release:
    types: [published]
jobs:
  main:
    name: Build release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php_version: "8.0"
            composer_file: "composer-v8.0.json"
          - php_version: "8.1"
            composer_file: "composer.json"
          - php_version: "8.2"
            composer_file: "composer.json"
          - php_version: "8.3"
            composer_file: "composer.json"
          - php_version: "8.4"
            composer_file: "composer.json"
          - php_version: "8.5"
            composer_file: "composer.json"
          - php_version: "8.6"
            composer_file: "composer.json"
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP ${{ matrix.php_version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}

      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - run: pip install pre-commit

      - name: Install dependencies
        if: matrix.composer_file == 'composer.json'
        uses: ramsey/composer-install@v2
        with:
          composer-options: "--no-dev --optimize-autoloader --ignore-platform-reqs"

      - name: Install dependencies (PHP 8.0)
        if: matrix.composer_file != 'composer.json'
        env:
          COMPOSER: ${{ matrix.composer_file }}
        run: composer install --no-dev --optimize-autoloader --ignore-platform-reqs --no-interaction

      - run: yarn install

      - name: Transpile to PHP ${{ matrix.php_version }}
        run: |
          docker run \
          --rm \
          --env PHP_VERSION=${{ matrix.php_version }} \
          -v $(pwd):/project \
          budziam/rector:2.5.8 \
          process \
          /project/includes \
          --config /project/rector.php

      - run: yarn build
        env:
          NODE_ENV: production

      - run: ./remove_unnecessary_files.sh

      - run: pre-commit run --all-files || true

      - name: Save build version
        run: sed -i "s/BUILD=.*/BUILD=php${{ matrix.php_version }}/" ./confidential/.meta

      - name: Change file permissions
        run: chmod 777 confidential/ data/ data/cache/ data/logs/ data/transactions/

      - id: build_artifact
        run: |
          zip -r \
          --exclude='data/cache/**' \
          --exclude='data/errors/**' \
          --exclude='data/transactions/**' \
          ${BUILD_NAME} \
          build/ \
          bootstrap/ \
          confidential/ \
          data/ \
          includes/ \
          migrations/ \
          translations/ \
          themes/ \
          vendor/ \
          .htaccess \
          favicon.png \
          index.php \
          README.md
          echo "{ARTIFACT_PATH}={./$BUILD_NAME}" >> $GITHUB_OUTPUT
          echo "{ARTIFACT_NAME}={$BUILD_NAME}" >> $GITHUB_OUTPUT
        env:
          BUILD_NAME: build-${{ matrix.php_version }}.zip

      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: ${{ steps.build_artifact.outputs.ARTIFACT_PATH }}
          asset_name: ${{ steps.build_artifact.outputs.ARTIFACT_NAME }}
          asset_content_type: application/zip
