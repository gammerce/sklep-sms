<!DOCTYPE html>
<html>
    <head>
        {$header}
        <style>
            .navigation {
                position: relative;
                height: 50px;
                min-width: 900px;

                margin: 0;
                padding: 4px;

                background: rgba(20, 20, 20, 0.9);
                box-shadow: 0px 2px 2px black;

                white-space: nowrap;
            }

            .navigation brick {
                display: inline-block;
                height: 100%;
                vertical-align: top;
            }

            .navigation brick img {
                height: 36px;
            }

            .navigation .vert_line {
                margin: 0 12px;
                width: 2px;
                background: grey;
            }

            .navigation .options {
                display: inline-block;
                height: 100%;
            }

            .navigation .options brick {
                font-size: 18px;
                color: #ccc;
                cursor: pointer;

                text-align: center;
                padding: 0 27px;
                padding-top: 8px;
            }

            .navigation .options brick.active {
                background: brown;
                color: #fff;
                text-shadow: 0px 0px 10px white;

                height: initial;
                margin-top: -4px;
                padding-top: 28px;
                padding-bottom: 8px;
            }
        </style>
    </head>
    <body>
        <script>
            (function(i, s, o, g, r, a, m) {
                i["GoogleAnalyticsObject"] = r;
                (i[r] =
                    i[r] ||
                    function() {
                        (i[r].q = i[r].q || []).push(arguments);
                    }),
                    (i[r].l = 1 * new Date());
                (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
                a.async = 1;
                a.src = g;
                m.parentNode.insertBefore(a, m);
            })(window, document, "script", "//www.google-analytics.com/analytics.js", "ga");

            ga("create", "UA-47484282-1", "sklep-sms.pl");
            ga("send", "pageview");
        </script>

        <div class="navigation">
            <brick>
                <img src="https://sklep-sms.pl/images/logo_small.png" alt="sklepsms" />
            </brick>

            <brick class="vert_line"></brick>

            <div class="options">
                <a href="https://sklep-sms.pl/"><brick>Info</brick></a>
                <a href="https://sklep.sklep-sms.pl/"><brick class="active">Kup Licencję</brick></a>
                <a href="https://sklep-sms.pl/download"><brick>Download</brick></a>
                <a href="https://sklep-sms.pl/config"><brick>Konfiguracja</brick></a>
                <a href="https://forum.sklep-sms.pl/"><brick>Forum</brick></a>
                <a href="https://sklep-sms.pl/contact"><brick>Kontakt</brick></a>
            </div>
        </div>

        <table class="contentwraper">
            <tr>
                <td></td>
                <td>{$loggedInfo}{$wallet}</td>
                <td>
                    <div id="language_choice">
                        <img
                            src="{{ $url->to('build/images/polish.jpg') }}"
                            id="language_polish"
                            title="{$lang->languages['polish']}"
                        />&nbsp;
                        <img
                            src="{{ $url->to('build/images/english.jpg') }}"
                            id="language_english"
                            title="{$lang->languages['english']}"
                        />
                    </div>
                </td>
            </tr>

            <tr>
                <td></td>
                <td class="header_wraper_td">
                    <table>
                        <tr>
                            <td>
                                <div class="content_title">{{ $heart->pageTitle }}</div>
                            </td>
                            <td class="right">
                                <a href="{{ $url->to('/') }}"
                                    ><img
                                        src="https://sklep-sms.pl/images/logo_medium.png"
                                        alt="sklep-sms"
                                /></a>
                            </td>
                        </tr>
                    </table>
                </td>
                <td></td>
            </tr>
            <tr>
                <td class="services_buttons_td">{$servicesButtons}</td>
                <td class="content_td">{$content}</td>
                <td class="user_buttons_td">{$userButtons}</td>
            </tr>
        </table>

        <br /><br />
    </body>
</html>
