<form id="form_purchase" class="shopsms_license_purchase">
    <div class="columns is-multiline">
        <div class="column is-half">
            <div class="header1">
                <b>{$lang->t('engines_for_shop')}</b><br />
                <span class="hint">{$lang->t('price_per_option')}</span>
            </div>
            <div class="engines" name="engines">
                <input type="hidden" name="platform_amxmodx" />

                <div class="engine amxx" title="Counter Strike 1.6, etc.">AMX Mod X</div>
                <input type="hidden" name="platform_sourcemod" />

                <div
                    class="engine sm"
                    title="Counter Strike: Global Offensive, Team Fortress 2, etc."
                >
                    SOURCEMOD
                </div>
            </div>
        </div>

        <div class="column is-half">
            <div class="header1">
                <label for="amount">{$lang->t('license_duration')}</label><br />
                <span class="hint">{$lang->t('license_price')}</span>
            </div>
            <div class="field">
                <div class="control">
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        min="0"
                        class="input is-small"
                        style="width: 100px"
                        value="{{ $days }}"
                    />&nbsp;{{ $serviceTag }}
                </div>
            </div>
        </div>

        <div class="column is-full">
            <div class="header1">
                <label for="email">{$lang->t('give_email')}</label>
            </div>
            <div class="field">
                <div class="control">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="input is-small"
                        value="{$user->getEmail()}"
                    />
                </div>
            </div>
        </div>

        <div class="column is-full">
            <div class="column_bottom">
                <div class="has-text-centered">
                    <img
                        src="{{ $url->to('build/images/reload.png') }}"
                        id="cost_reload"
                        title="{$lang->t('reload')}"
                        alt="reload"
                    />
                    <span style="text-transform: uppercase;">{$lang->t('price')}:</span>
                    <span id="cost">{$lang->t('none')}</span><br />
                </div>
            </div>
        </div>

        <div class="column is-full has-text-centered">
            <input
                type="button"
                id="go_to_payment"
                value="{$lang->t('go_to_payment')}"
                class="button is-success purchase_button"
            />
        </div>
    </div>

    <input type="hidden" name="service_id" value="{{ $serviceId }}" />
</form>
