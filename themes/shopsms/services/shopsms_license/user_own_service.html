<form class="row" data-module="{{ $moduleId }}" data-row="{{ $userService['id'] }}">
    <div class="brick regenerated_token_box">Nowy token: <strong class="token_value"></strong></div>

    <div class="fright">
        <a
            href="{{ $url->to('/page/purchase?service=ss_license_plong&identifier=' . $identifier) }}"
            style="text-decoration: none;"
        >
            <button class="button is-small prolong_license" type="button">
                {$lang->t('prolong_license')}
            </button> </a
        ><br />

        <button
            class="button is-small regenerate_token"
            type="button"
            onClick="regenerate_token('{{ $identifier }}', this)"
        >
            {$lang->t('regenerate_token')}</button
        ><br />

        {$buttonEdit}
    </div>

    <b>{$lang->t('service')}</b>: {{ $serviceName }}<br />
    <b>{$lang->t('identifier')}</b>: {{ $identifier }}<br />
    <b>{$lang->t('engines')}</b>: {{ $engines }}<br />
    <b>{$lang->t('email')}</b>: {{ $email }}<br />
    <br />
    <b>{$lang->t('expire')}</b>: {{ $expire }}<br />
    <b>{$lang->t('price_monthly')}</b>: {{ $costMonthly }} {{ $settings['currency'] }}
</form>
