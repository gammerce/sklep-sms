<form id="form_purchase" class="shopsms_license_prolong_purchase">
    <input type="password" style="display: none;" />
    <div class="column_left">
        <div class="piece">
            <div class="header1">
                <b>Podaj dane licencji.</b>
            </div>
            <div class="table_form" style="margin-left: 20px;" name="license_data">
                <div class="row">
                    <div class="cell">
                        <b>{$lang->translate('identifier')}</b>
                    </div>
                    <div class="cell">
                        <input type="text" name="identifier" value="{$identifier}" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="column_right">
        <div class="piece">
            <div class="header1">
                <b>{$lang->translate('license_prolong_time')}</b><br />
                <span class="hint">{$lang->translate('license_price')}</span>
            </div>
            <div class="center">
                <input type="text" name="amount" style="width: 40px" />&nbsp;{$serviceTag}
            </div>
        </div>
    </div>

    <div class="column_bottom">
        <div class="center">
            <img
                src="{$settings['shop_url_slash']}images/reload.png"
                id="cost_reload"
                title="{$lang->translate('reload')}"
            />
            <span style="text-transform: uppercase;">{$lang->translate('price')}:</span>
            <span id="cost">{$lang->translate('none')}</span><br />
        </div>
    </div>
    {$lang->translate('sms_payment_conditions')}

    <div class="purchase_button_wraper">
        <input
            type="button"
            id="go_to_payment"
            value="{$lang->translate('go_to_payment')}"
            class="button is-success purchase_button"
        />
    </div>

    <input type="hidden" name="service" value="{$serviceId}" />
</form>
